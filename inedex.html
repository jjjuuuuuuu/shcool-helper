<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교 가기 전 준비 도우미</title>
<style>
  :root {
    --primary: #059669;
    --primary-dark: #065f46;
    --primary-soft: #ecfdf5;
    --bg: #f4f8f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 17px;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 20px 0 10px; }
  header h1 { margin: 0; font-size: 1.7rem; color: var(--primary-dark); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .card h2 { margin: 0 0 14px; font-size: 1.15rem; }
  .step {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; margin-right: 8px;
    background: var(--primary); color: #fff; border-radius: 50%;
    font-size: .85rem;
  }

  /* 선택 버튼 */
  .choices { display: grid; gap: 10px; }
  .choices.levels { grid-template-columns: repeat(2, 1fr); }
  .choices.scenarios { grid-template-columns: 1fr; }
  @media (min-width: 560px) {
    .choices.levels { grid-template-columns: repeat(4, 1fr); }
    .choices.scenarios { grid-template-columns: repeat(3, 1fr); }
  }
  .choice {
    border: 2px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 14px 8px;
    cursor: pointer;
    text-align: center;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    transition: all .15s;
  }
  .choice:hover { border-color: var(--primary); }
  .choice .icon { font-size: 2rem; display: block; margin-bottom: 4px; }
  .choice .name { font-weight: 700; display: block; }
  .choice .desc { font-size: .8rem; color: var(--muted); display: block; }
  .choice[aria-pressed="true"] {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 0 0 3px rgba(5,150,105,.15);
  }

  /* 시간 입력 */
  .fields { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 600px) { .fields { grid-template-columns: repeat(3, 1fr); } }
  label.field-label { display: block; font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
  input[type="time"], input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .quick button {
    border: 1px solid var(--border);
    background: #f9fafb;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: .85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .quick button:hover { background: var(--primary-soft); border-color: var(--primary); }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--primary); font-weight: 700; }

  /* 결과 */
  .result {
    margin-top: 18px;
    background: linear-gradient(135deg, #059669, #047857);
    color: #fff;
    border-radius: 16px;
    padding: 22px 20px;
    text-align: center;
  }
  .result .label { font-size: .95rem; opacity: .9; }
  .result .time { font-size: 3rem; font-weight: 800; letter-spacing: 1px; margin: 4px 0; }
  .result .time small { font-size: 1.1rem; font-weight: 600; margin-right: 6px; }
  .result .breakdown {
    margin-top: 10px; font-size: .92rem; opacity: .95;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px;
  }
  .result .note {
    margin-top: 12px; background: rgba(255,255,255,.18);
    border-radius: 10px; padding: 8px 12px; font-size: .88rem;
  }
  .result .countdown {
    margin-top: 8px; background: rgba(255,255,255,.95); color: var(--primary-dark);
    border-radius: 10px; padding: 8px 12px; font-size: .92rem; font-weight: 700;
  }
  .result .countdown.late { color: #b91c1c; background: #fee2e2; }
  .result.empty { background: #e5e7eb; color: var(--muted); }
  .result.empty .time { font-size: 1.2rem; font-weight: 600; }

  /* 체크리스트 */
  .progress-wrap { margin-bottom: 14px; }
  .progress-text { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .progress { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--ok); transition: width .25s; }

  .group-title {
    margin: 18px 0 8px; font-size: .95rem; font-weight: 700; color: var(--primary-dark);
    padding-bottom: 4px; border-bottom: 2px solid var(--primary-soft);
  }
  ul.list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 8px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .item:hover { background: #fafafa; }
  .item input[type="checkbox"] {
    width: 24px; height: 24px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--ok); cursor: pointer;
  }
  .item .txt { flex: 1; }
  .item .tip { display: block; font-size: .82rem; color: var(--muted); }
  .item.done .main { text-decoration: line-through; color: var(--muted); }
  .item .del {
    border: none; background: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; padding: 0 4px;
  }

  .add-row { display: flex; gap: 8px; margin-top: 16px; }
  .add-row input[type="text"] {
    flex: 1; padding: 11px; font-size: 1rem; border: 2px solid var(--border);
    border-radius: 10px; font-family: inherit; min-width: 0;
  }
  .add-row input:focus { outline: none; border-color: var(--primary); }
  .btn {
    border: none; background: var(--primary); color: #fff; padding: 0 18px;
    border-radius: 10px; font-size: .95rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: #f3f4f6; color: var(--text); padding: 10px 14px; }
  .btn.ghost:hover { background: #e5e7eb; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .complete-msg {
    display: none; margin-top: 14px; text-align: center; padding: 12px;
    background: #ecfdf5; color: #065f46; border-radius: 10px; font-weight: 700;
  }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏫 학교 가기 전 준비 도우미</h1>
    <p>학교급과 상황에 맞는 준비물과 출발 시간을 확인하세요</p>
  </header>

  <!-- 1. 학교급 선택 -->
  <section class="card">
    <h2><span class="step">1</span>어느 학교에 다니나요?</h2>
    <div class="choices levels" id="levels"></div>
  </section>

  <!-- 2. 상황 선택 -->
  <section class="card">
    <h2><span class="step">2</span>어떤 상황인가요?</h2>
    <div class="choices scenarios" id="scenarios"></div>
  </section>

  <!-- 3. 시간 입력 -->
  <section class="card">
    <h2><span class="step">3</span>출발 시간 계산</h2>
    <div class="fields">
      <div>
        <label class="field-label" for="arrive" id="arriveLabel">학교 도착 시간</label>
        <input type="time" id="arrive" value="08:40">
        <div class="hint" id="arriveHint"></div>
      </div>
      <div>
        <label class="field-label" for="travel">이동 시간 (분)</label>
        <input type="number" id="travel" min="0" max="600" step="5" value="30" inputmode="numeric">
        <div class="quick" data-target="travel">
          <button type="button" data-v="10">10분</button>
          <button type="button" data-v="20">20분</button>
          <button type="button" data-v="30">30분</button>
          <button type="button" data-v="60">1시간</button>
        </div>
      </div>
      <div>
        <label class="field-label" for="buffer">여유 시간 (분)</label>
        <input type="number" id="buffer" min="0" max="300" step="5" value="10" inputmode="numeric">
        <div class="quick" data-target="buffer">
          <button type="button" data-v="10">10분</button>
          <button type="button" data-v="20">20분</button>
          <button type="button" data-v="30">30분</button>
          <button type="button" data-v="60">1시간</button>
        </div>
        <div class="hint" id="bufferHint"></div>
      </div>
    </div>

    <div class="result empty" id="result"></div>
  </section>

  <!-- 4. 준비물 -->
  <section class="card">
    <h2><span class="step">4</span><span id="listTitle">준비물 목록</span></h2>
    <div class="progress-wrap">
      <div class="progress-text"><span id="progressText">0 / 0 완료</span><span id="progressPct">0%</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div id="checklist"></div>

    <div class="add-row">
      <input type="text" id="customInput" placeholder="나만의 준비물 추가 (예: 리코더)" maxlength="40">
      <button class="btn" id="addBtn" type="button">추가</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="resetBtn" type="button">체크 모두 해제</button>
    </div>
    <div class="complete-msg" id="completeMsg">✅ 준비 완료! 오늘도 즐거운 학교생활 되세요.</div>
  </section>

  <footer>체크 상태와 입력값은 이 기기의 브라우저에 자동 저장됩니다.<br>
  일반적인 안내이며, 다니시는 학교의 안내사항을 우선 확인하세요.</footer>
</div>

        ["수강 시간표 조정", "{room} 간 이동 시간을 넉넉히, 1층·엘리베이터 근처 강의실 우선"],
        ["교수님께 사전 안내", "강의실 변경, 출석·과제 관련 배려 요청"],

      ],
    }
  },
  wheelchair: {
    icon: "♿", name: "휠체어 이용", desc: "휠체어를 타고 등교", buffer: 30,
    items: [
      ["휠체어 상태 점검", "타이어 공기압, 브레이크, 팔걸이·발판 고정 확인"],
      ["전동휠체어 배터리 충전 확인", "충전량이 충분한지 · 충전기도 챙기기"],
      ["장애인 콜택시·저상버스 예약", "예약이 필요하면 전날 미리 확인"],
      ["{school} 경사로·엘리베이터 상태 확인", "고장·공사 여부를 미리 문의"],
      ["장애인 화장실 위치 확인", "{room}에서 가까운 곳, 이용 가능 상태"],
      ["책상 높이·{room} 내 이동 공간 확인", "휠체어가 들어갈 책상, 통로 확보 요청"],
      ["욕창 방지 방석", "오래 앉아 있어도 편하게"],
      ["무릎담요·겉옷·우비/레인커버", "체온 유지, 비 오는 날 대비"],
      ["가방 걸이·휠체어 부착 가방", "가방을 안전하게 싣기"],
      ["휴대폰·보조배터리", "긴급 연락과 콜택시 이용에 필요"],
      ["활동지원사·보조 인력 일정 확인", "등하교·이동 지원 시간 맞추기"],
      ["간단한 수리 도구·펑크 패치", "예상치 못한 고장 대비"],
      ["장애인 복지카드", "교통 감면·콜택시 이용 시 필요"],
    ],
    extra: {
      elementary: [
        ["{teacher}·특수교사와 이동 동선 협의", "승강기 사용 방법과 비상시 대피 방법"],
        ["하교 시 인계 방법 확인", "보호자·활동지원사가 만나는 장소와 시간"],
        ["체육·현장학습 참여 방법 상담"],
      ],
      middle: [
        ["특수교육실무사·활동지원사 지원 시간 확인"],
        ["이동 수업 시 엘리베이터·경로 확인", "특별실·과학실·음악실 접근성"],
        ["체육 수업 참여 방법 상담"],
      ],
      high: [
        ["특별실·급식실·체육관 접근성 확인"],
        ["야간 귀가 교통 확인", "야간자율학습 후 콜택시 운행 시간·예약"],
        ["시험 편의 제공 신청", "별도 시험실, 시험 시간 연장 등"],
      ],
      university: [
        ["장애학생지원센터에 지원 신청", "이동·학습·시험 지원, 도우미 학생 배정"],
        ["강의 건물 엘리베이터·경사로 위치 확인", "접근이 어려운 강의실은 변경 요청"],
        ["도서관·학생식당·기숙사 접근성 확인"],
        ["캠퍼스 내 장애인 화장실·휴게 공간 위치 확인"],
        ["교통약자 셔틀·콜택시 이용 방법 확인"],
      ],
    }
  }
};

const COMMON = {
  title: "공통 준비물",
  items: [
    ["물병 (텀블러)", "하루 종일 마실 물"],
    ["마스크·손수건/휴지"],
    ["든든한 아침 식사", "아침을 먹어야 수업에 집중할 수 있어요"],
    ["휴대폰·충전 상태", "학교 규정에 맞게 사용, 긴급 연락용"],
    ["개인 상비약·알레르기 정보", "필요한 경우 보건 선생님께 미리 알려두기"],
    ["등교 경로·교통 상황 확인", "지연·공사·운행 중단 여부 확인"],
  ]
};

/* =====================================================
   상태
   ===================================================== */
const STORE_KEY = "schoolHelper.v2";

function recBuffer(level, scenario) {
  return SCENARIOS[scenario].buffer + LEVELS[level].bufferAdd;
}
function defaultState() {
  return {
    level: "elementary", scenario: "alone",
    arrive: LEVELS.elementary.arrive, travel: 30,
    buffer: recBuffer("elementary", "alone"),
    checked: {}, custom: {}
  };
}
function loadState() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
  const st = Object.assign(defaultState(), s);
  if (!LEVELS[st.level]) st.level = "elementary";
  if (!SCENARIOS[st.scenario]) st.scenario = "alone";
  return st;
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();
let dep = { min: null, dayNote: "" };

/* ---------- 요소 ---------- */
const $ = id => document.getElementById(id);
const elLevels = $("levels"), elScenarios = $("scenarios");
const elArrive = $("arrive"), elTravel = $("travel"), elBuffer = $("buffer");
const elResult = $("result"), elChecklist = $("checklist");

/* ---------- 문구 치환 ---------- */
function fmt(str) {
  const w = LEVELS[state.level].words;
  return str.replace(/\{(\w+)\}/g, (m, k) => w[k] || m);
}

/* =====================================================
   선택 버튼
   ===================================================== */
function renderChoices(container, data, currentKey, onPick) {
  container.innerHTML = "";
  Object.entries(data).forEach(([key, v]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.setAttribute("aria-pressed", currentKey === key);
    b.innerHTML = `<span class="icon">${v.icon}</span><span class="name">${v.name}</span><span class="desc">${v.desc}</span>`;
    b.addEventListener("click", () => onPick(key));
    container.appendChild(b);
  });
}

function changeSelection(newLevel, newScenario) {
  // 사용자가 직접 바꾸지 않은 값(이전 추천값 그대로)이면 새 추천값으로 자동 변경
  const prevArrive = LEVELS[state.level].arrive;
  const prevBuf = recBuffer(state.level, state.scenario);
  const usingPrevArrive = elArrive.value === prevArrive;
  const usingPrevBuf = parseInt(elBuffer.value, 10) === prevBuf;

  state.level = newLevel;
  state.scenario = newScenario;

  if (usingPrevArrive) elArrive.value = LEVELS[newLevel].arrive;
  if (usingPrevBuf) elBuffer.value = recBuffer(newLevel, newScenario);

  renderAll();
}

/* =====================================================
   시간 UI
   ===================================================== */
function renderTimeUI() {
  const L = LEVELS[state.level], S = SCENARIOS[state.scenario];

  $("arriveLabel").textContent = L.arriveLabel;
  $("arriveHint").innerHTML = `💡 ${L.arriveHint} <a href="#" id="applyArrive">적용</a>`;
  $("applyArrive").addEventListener("click", e => {
    e.preventDefault();
    elArrive.value = L.arrive;
    calcDeparture();
  });

  const rec = recBuffer(state.level, state.scenario);
  $("bufferHint").innerHTML = `💡 ${L.name} · ${S.name} 권장 여유시간: <b>${rec}분 이상</b> ` +
    `<a href="#" id="applyBuffer">적용</a>`;
  $("applyBuffer").addEventListener("click", e => {
    e.preventDefault();
    elBuffer.value = rec;
    calcDeparture();
  });
}

function pad(n) { return String(n).padStart(2, "0"); }

function calcDeparture() {
  const L = LEVELS[state.level];
  const arrive = elArrive.value;
  const travel = parseInt(elTravel.value, 10);
  const buffer = parseInt(elBuffer.value, 10);

  state.arrive = arrive;
  state.travel = isNaN(travel) || travel < 0 ? 0 : travel;
  state.buffer = isNaN(buffer) || buffer < 0 ? 0 : buffer;
  saveState();

  if (!arrive) {
    dep = { min: null, dayNote: "" };
    elResult.className = "result empty";
    elResult.innerHTML = `<div class="time">도착 시간을 입력해 주세요</div>`;
    return;
  }

  const [h, m] = arrive.split(":").map(Number);
  const arriveMin = h * 60 + m;
  let depMin = arriveMin - state.travel - state.buffer;
  let dayNote = "";
  if (depMin < 0) {
    depMin = ((depMin % 1440) + 1440) % 1440;
    dayNote = "전날";
  }
  const depH = Math.floor(depMin / 60), depM = depMin % 60;
  const ampm = depH < 12 ? "오전" : "오후";
  const h12 = depH % 12 === 0 ? 12 : depH % 12;

  const early = ((arriveMin - state.buffer) % 1440 + 1440) % 1440;
  const eh = Math.floor(early / 60), em = early % 60;

  elResult.className = "result";
  elResult.innerHTML = `
    <div class="label">🚪 이 시간까지는 집을 나서세요</div>
    <div class="time"><small>${dayNote ? dayNote + " " : ""}${ampm}</small>${pad(h12)}:${pad(depM)}</div>
    <div class="breakdown">
      <span>${L.icon} ${L.arriveLabel.replace(" 시간", "")} ${pad(h)}:${pad(m)}</span>
      <span>🚌 이동 ${state.travel}분</span>
      <span>⏳ 여유 ${state.buffer}분</span>
    </div>
    <div class="note">여유 시간 덕분에 ${L.words.school}에는 <b>${pad(eh)}:${pad(em)}</b>경 도착 예정이에요.
    (24시간제 ${pad(depH)}:${pad(depM)})</div>
    <div class="countdown" id="countdown" style="display:none"></div>
  `;
  dep = { min: depMin, dayNote };
  updateCountdown();
}

function updateCountdown() {
  const el = $("countdown");
  if (!el || dep.min === null) return;
  if (dep.dayNote) { el.style.display = "none"; return; }

  const now = new Date();
  const diff = dep.min - (now.getHours() * 60 + now.getMinutes());
  el.style.display = "block";
  if (diff >= 0) {
    const hh = Math.floor(diff / 60), mm = diff % 60;
    el.className = "countdown";
    el.textContent = diff === 0
      ? "⏰ 지금 출발할 시간이에요!"
      : `⏰ 지금부터 출발까지 ${hh ? hh + "시간 " : ""}${mm}분 남았어요`;
  } else if (diff > -120) {
    el.className = "countdown late";
    el.textContent = `⚠️ 출발 시간이 ${-diff}분 지났어요! 서두르세요`;
  } else {
    el.style.display = "none";
  }
}
setInterval(updateCountdown, 30000);

/* =====================================================
   체크리스트
   ===================================================== */
function customKey() { return `${state.level}|${state.scenario}`; }

function getGroups() {
  const L = LEVELS[state.level], S = SCENARIOS[state.scenario];
  const extra = S.extra[state.level] || [];
  const groups = [
    { title: `${L.icon} ${L.name} 준비물`, items: L.items, prefix: `lv-${state.level}` },
    { title: `${S.icon} ${S.name} 상황 준비물`, items: S.items, prefix: `sc-${state.scenario}` },
  ];
  if (extra.length) {
    groups.push({ title: `✨ ${L.name} · ${S.name} 맞춤 준비물`, items: extra, prefix: `ex-${state.scenario}-${state.level}` });
  }
  groups.push({ title: COMMON.title, items: COMMON.items, prefix: "common" });
  return groups;
}

function renderChecklist() {
  const L = LEVELS[state.level], S = SCENARIOS[state.scenario];
  $("listTitle").textContent = `${L.icon} ${L.name} · ${S.icon} ${S.name} 준비물`;
  elChecklist.innerHTML = "";

  getGroups().forEach(g => {
    const h = document.createElement("div");
    h.className = "group-title";
    h.textContent = g.title;
    elChecklist.appendChild(h);

    const ul = document.createElement("ul");
    ul.className = "list";
    g.items.forEach((it, idx) => {
      ul.appendChild(makeItem(`${g.prefix}:${idx}`, fmt(it[0]), it[1] ? fmt(it[1]) : "", null));
    });
    elChecklist.appendChild(ul);
  });

  const customs = state.custom[customKey()] || [];
  if (customs.length) {
    const h = document.createElement("div");
    h.className = "group-title";
    h.textContent = "내가 추가한 준비물";
    elChecklist.appendChild(h);
    const ul = document.createElement("ul");
    ul.className = "list";
    customs.forEach(c => ul.appendChild(makeItem(`custom:${c.id}`, c.text, "", c.id)));
    elChecklist.appendChild(ul);
  }
  updateProgress();
}

function makeItem(id, text, tip, customId) {
  const li = document.createElement("li");
  const label = document.createElement("label");
  label.className = "item" + (state.checked[id] ? " done" : "");

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.dataset.id = id;
  cb.checked = !!state.checked[id];
  cb.addEventListener("change", () => {
    if (cb.checked) state.checked[id] = true; else delete state.checked[id];
    label.classList.toggle("done", cb.checked);
    saveState();
    updateProgress();
  });

  const span = document.createElement("span");
  span.className = "txt";
  const main = document.createElement("span");
  main.className = "main";
  main.textContent = text;
  span.appendChild(main);
  if (tip) {
    const t = document.createElement("span");
    t.className = "tip";
    t.textContent = tip;
    span.appendChild(t);
  }

  label.appendChild(cb);
  label.appendChild(span);

  if (customId) {
    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.title = "삭제";
    del.textContent = "✕";
    del.addEventListener("click", e => {
      e.preventDefault();
      const key = customKey();
      state.custom[key] = state.custom[key].filter(c => c.id !== customId);
      delete state.checked[`custom:${customId}`];
      saveState();
      renderChecklist();
    });
    label.appendChild(del);
  }
  li.appendChild(label);
  return li;
}

function updateProgress() {
  const boxes = elChecklist.querySelectorAll('input[type="checkbox"]');
  const total = boxes.length;
  const done = [...boxes].filter(b => b.checked).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("progressText").textContent = `${done} / ${total} 완료`;
  $("progressPct").textContent = pct + "%";
  $("progressBar").style.width = pct + "%";
  $("completeMsg").style.display = (total && done === total) ? "block" : "none";
}

/* =====================================================
   전체 그리기 & 이벤트
   ===================================================== */
function renderAll() {
  renderChoices(elLevels, LEVELS, state.level, key => changeSelection(key, state.scenario));
  renderChoices(elScenarios, SCENARIOS, state.scenario, key => changeSelection(state.level, key));
  renderTimeUI();
  calcDeparture();   // 내부에서 상태 저장
  renderChecklist();
}

[elArrive, elTravel, elBuffer].forEach(el => el.addEventListener("input", calcDeparture));

document.querySelectorAll(".quick").forEach(group => {
  group.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    $(group.dataset.target).value = e.target.dataset.v;
    calcDeparture();
  });
});

function addCustom() {
  const input = $("customInput");
  const v = input.value.trim();
  if (!v) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const key = customKey();
  (state.custom[key] = state.custom[key] || []).push({ id, text: v });
  input.value = "";
  saveState();
  renderChecklist();
}
$("addBtn").addEventListener("click", addCustom);
$("customInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) addCustom();
});

$("resetBtn").addEventListener("click", () => {
  elChecklist.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    delete state.checked[cb.dataset.id];
  });
  saveState();
  renderChecklist();
});

/* ---------- 초기화 ---------- */
elArrive.value = state.arrive;
elTravel.value = state.travel;
elBuffer.value = state.buffer;
renderAll();
</script>
